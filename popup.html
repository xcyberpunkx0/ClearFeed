<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ClearFeed</title>
  <style>
    @font-face {
      font-family: 'Sora';
      font-style: normal;
      font-weight: 100 800;
      src: url('fonts/sora.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Doto';
      font-style: normal;
      font-weight: 100 900;
      src: url('fonts/doto.woff2') format('woff2');
    }

    :root {
      --grad-a: #3ea6ff;
      --grad-b: #a78bfa;
      --grad: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      --bg: #ffffff;
      --tx: #0f0f0f;
      --tx2: #606060;
      --card: #f5f5f5;
      --chip: #f2f2f2;
      --chip-hover: #e5e5e5;
      --hair: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --tx: #f1f1f1;
        --tx2: #999999;
        --card: #111111;
        --chip: #161616;
        --chip-hover: #262626;
        --hair: rgba(255, 255, 255, 0.14);
      }
    }

    body {
      width: 300px;
      padding: 18px 20px 20px;
      font-family: 'Sora', 'Roboto', 'Arial', sans-serif;
      background-color: var(--bg);
      color: var(--tx);
      margin: 0;
    }

    header.brand {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hair);
    }

    .wordmark {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
      background-image: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #cf-timer-line {
      font-size: 11px;
      color: var(--tx2);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--tx2);
      letter-spacing: 0.3px;
      margin: 16px 0 2px;
    }

    /* Theme picker */
    .swatches {
      display: flex;
      gap: 8px;
      padding: 10px 0 2px;
    }
    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      box-sizing: border-box;
      transition: transform 0.15s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.on {
      border-color: var(--tx);
      box-shadow: 0 0 0 2px var(--bg) inset;
    }
    .swatch:focus-visible { outline: 2px solid var(--grad-a); outline-offset: 2px; }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--hair);
    }

    .setting-item.zen {
      padding: 12px 0;
    }

    .setting-label {
      font-size: 13px;
    }

    .setting-item.zen .setting-label {
      font-weight: 600;
    }

    /* Switch: hidden checkbox + track/knob */
    .switch {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .tag {
      position: relative;
      display: block;
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: var(--chip-hover);
      transition: background 0.2s;
      pointer-events: none;
    }

    .tag::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transform: translateY(-50%);
      transition: transform 0.2s;
    }

    input:checked + .tag {
      background: var(--grad);
    }

    input:checked + .tag::after {
      transform: translate(16px, -50%);
      background: #fff;
    }

    input:focus-visible + .tag {
      outline: 2px solid var(--grad-a);
      outline-offset: 2px;
    }

    /* Stats */
    .bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      height: 56px;
      padding: 12px 4px 0;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      height: 100%;
    }
    .bar {
      width: 100%;
      max-width: 18px;
      border-radius: 3px 3px 0 0;
      background: var(--grad);
      min-height: 2px;
    }
    .bar.empty { background: var(--chip); }
    .bar-day {
      font-family: 'Doto', monospace;
      font-weight: 900;
      font-size: 10px;
      color: var(--tx2);
    }
    .bar-col.today .bar-day { color: var(--tx); }

    #cf-stats-totals {
      font-size: 11px;
      color: var(--tx2);
      text-align: center;
      margin-top: 10px;
      line-height: 1.8;
    }
    #cf-stats-totals b {
      color: var(--tx);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <div class="wordmark">ClearFeed</div>
    <div id="cf-timer-line">Ready</div>
  </header>

  <div class="setting-item zen">
    <span class="setting-label" id="zenModeLabel">Zen mode</span>
    <label class="switch">
      <input type="checkbox" id="zenMode" aria-labelledby="zenModeLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="section-label">Theme</div>
  <div class="swatches" id="cf-themes" role="radiogroup" aria-label="Theme color"></div>

  <div class="section-label">Hide on YouTube</div>

  <div class="setting-item">
    <span class="setting-label" id="hideShortsLabel">Shorts</span>
    <label class="switch">
      <input type="checkbox" id="hideShorts" aria-labelledby="hideShortsLabel" checked>
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideSidebarLabel">Related videos</span>
    <label class="switch">
      <input type="checkbox" id="hideSidebar" aria-labelledby="hideSidebarLabel" checked>
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideCommentsLabel">Comments</span>
    <label class="switch">
      <input type="checkbox" id="hideComments" aria-labelledby="hideCommentsLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideHomeFeedLabel">Home feed</span>
    <label class="switch">
      <input type="checkbox" id="hideHomeFeed" aria-labelledby="hideHomeFeedLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideEndCardsLabel">End cards</span>
    <label class="switch">
      <input type="checkbox" id="hideEndCards" aria-labelledby="hideEndCardsLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideNotifBellLabel">Notification bell</span>
    <label class="switch">
      <input type="checkbox" id="hideNotifBell" aria-labelledby="hideNotifBellLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="section-label">This week</div>
  <div class="bars" id="cf-stats-bars"></div>
  <div id="cf-stats-totals"></div>

  <script src="popup.js"></script>
</body>
</html>
