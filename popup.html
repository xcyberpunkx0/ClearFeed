<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ClearFeed Settings</title>
  <style>
    :root {
      --bg: #faf8f3;
      --tx: #0a0a0a;
      --tx-muted: #6e6a5f;
      --hair: rgba(10, 10, 10, 0.12);
      --hair-strong: rgba(10, 10, 10, 0.3);
      --grad-a: #3ea6ff;
      --grad-b: #a78bfa;
      --grad: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --tx: #f4f2ed;
        --tx-muted: #8a877f;
        --hair: rgba(244, 242, 237, 0.12);
        --hair-strong: rgba(244, 242, 237, 0.25);
      }
    }

    body {
      width: 300px;
      padding: 22px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--tx);
      margin: 0;
    }

    header.brand {
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--hair-strong);
    }

    .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 1.7rem;
      letter-spacing: -0.5px;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .mono {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    }

    #cf-timer-line {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--tx-muted);
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }

    .section-label {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--tx-muted);
      margin: 18px 0 2px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--hair);
    }

    .setting-item.zen {
      border-bottom: 1px solid var(--hair-strong);
      padding: 14px 0;
    }

    .setting-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Telemetry tag toggle: hidden checkbox + [ARMED]/[OFF] text */
    .switch {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .tag {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .tag::after {
      content: '[OFF]';
      color: var(--tx-muted);
    }

    input:checked + .tag::after {
      content: '[ARMED]';
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input:focus-visible + .tag {
      outline: 2px solid var(--grad-a);
      outline-offset: 3px;
    }

    /* Stats */
    .bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      height: 56px;
      padding: 12px 4px 0;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      height: 100%;
    }
    .bar {
      width: 100%;
      max-width: 18px;
      border-radius: 3px 3px 0 0;
      background: var(--grad);
      min-height: 2px;
    }
    .bar.empty { background: var(--hair); }
    .bar-day {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--tx-muted);
    }
    .bar-col.today .bar-day { color: var(--tx); font-weight: 700; }

    #cf-stats-totals {
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--tx-muted);
      text-align: center;
      margin-top: 10px;
      line-height: 1.7;
    }
    #cf-stats-totals b {
      color: var(--tx);
      font-weight: 600;
    }

    footer {
      margin-top: 20px;
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
      font-size: 8px;
      font-weight: 500;
      color: var(--tx-muted);
      text-align: center;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <div class="wordmark">ClearFeed</div>
    <div id="cf-timer-line">Idle — Ready</div>
  </header>

  <div class="setting-item zen">
    <span class="setting-label" id="zenModeLabel">Zen Mode</span>
    <label class="switch">
      <input type="checkbox" id="zenMode" aria-labelledby="zenModeLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="section-label">Hide</div>

  <div class="setting-item">
    <span class="setting-label" id="hideShortsLabel">Shorts</span>
    <label class="switch">
      <input type="checkbox" id="hideShorts" aria-labelledby="hideShortsLabel" checked>
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideSidebarLabel">Related Sidebar</span>
    <label class="switch">
      <input type="checkbox" id="hideSidebar" aria-labelledby="hideSidebarLabel" checked>
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideCommentsLabel">Comments</span>
    <label class="switch">
      <input type="checkbox" id="hideComments" aria-labelledby="hideCommentsLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideHomeFeedLabel">Home Feed</span>
    <label class="switch">
      <input type="checkbox" id="hideHomeFeed" aria-labelledby="hideHomeFeedLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideEndCardsLabel">End Cards</span>
    <label class="switch">
      <input type="checkbox" id="hideEndCards" aria-labelledby="hideEndCardsLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="setting-item">
    <span class="setting-label" id="hideNotifBellLabel">Notification Bell</span>
    <label class="switch">
      <input type="checkbox" id="hideNotifBell" aria-labelledby="hideNotifBellLabel">
      <span class="tag"></span>
    </label>
  </div>

  <div class="section-label">This Week</div>
  <div class="bars" id="cf-stats-bars"></div>
  <div id="cf-stats-totals"></div>

  <footer>
    Silence the noise
  </footer>

  <script src="popup.js"></script>
</body>
</html>
