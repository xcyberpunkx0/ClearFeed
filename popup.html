<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ClearFeed</title>
  <style>
    @font-face {
      font-family: 'Sora';
      font-style: normal;
      font-weight: 100 800;
      src: url('fonts/sora.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Doto';
      font-style: normal;
      font-weight: 100 900;
      src: url('fonts/doto.woff2') format('woff2');
    }

    :root {
      --grad-a: #3ea6ff;
      --grad-b: #a78bfa;
      --grad: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      --bg: #ffffff;
      --tx: #0f0f0f;
      --tx2: #606060;
      --card: #f5f5f5;
      --chip: #f2f2f2;
      --chip-hover: #e5e5e5;
      --hair: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --tx: #f1f1f1;
        --tx2: #999999;
        --card: #111111;
        --chip: #161616;
        --chip-hover: #262626;
        --hair: rgba(255, 255, 255, 0.14);
      }
    }

    * { box-sizing: border-box; }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: 'Sora', 'Roboto', 'Arial', sans-serif;
      background-color: var(--bg);
      color: var(--tx);
      -webkit-font-smoothing: antialiased;
    }

    /* Header: wordmark + live timer pill */
    header.brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
      background-image: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #cf-timer-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--chip);
      font-size: 11px;
      color: var(--tx2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #cf-timer-line::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--tx2);
      opacity: 0.5;
    }
    #cf-timer-line[data-state="running"] { color: var(--tx); }
    #cf-timer-line[data-state="running"]::before { background: var(--grad); opacity: 1; }

    /* Cards & sections */
    .card {
      background: var(--card);
      border: 1px solid var(--hair);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--tx2);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin: 18px 2px 8px;
    }

    /* Stats card */
    .stats { display: flex; align-items: center; gap: 14px; }
    #cf-stats-totals {
      flex: 1;
      font-size: 11px;
      color: var(--tx2);
      line-height: 1.7;
    }
    #cf-stats-totals .stat-big {
      font-family: 'Doto', monospace;
      font-weight: 900;
      font-size: 26px;
      line-height: 1;
      margin-bottom: 4px;
      color: var(--tx);
      background-image: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #cf-stats-totals > div:nth-child(2) { margin-bottom: 4px; }
    #cf-stats-totals b {
      color: var(--tx);
      font-weight: 600;
    }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 56px;
      width: 112px;
      flex-shrink: 0;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      height: 100%;
    }
    .bar {
      width: 100%;
      max-width: 12px;
      border-radius: 3px;
      background: var(--grad);
      min-height: 2px;
    }
    .bar.empty { background: var(--chip-hover); }
    .bar-day {
      font-family: 'Doto', monospace;
      font-weight: 900;
      font-size: 9px;
      color: var(--tx2);
    }
    .bar-col.today .bar-day { color: var(--tx); }

    /* Watch-page modes: rows with a hint line and a switch */
    .modes { padding: 4px 14px; }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    .setting-item + .setting-item { border-top: 1px solid var(--hair); }
    .setting-label {
      font-size: 13px;
      font-weight: 500;
    }
    .setting-hint {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--tx2);
      margin-top: 3px;
    }

    /* Switch: hidden checkbox + track/knob */
    .switch {
      position: relative;
      display: inline-block;
      flex-shrink: 0;
      cursor: pointer;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }
    .tag {
      position: relative;
      display: block;
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: var(--chip-hover);
      transition: background 0.2s;
      pointer-events: none;
    }
    .tag::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transform: translateY(-50%);
      transition: transform 0.2s;
    }
    input:checked + .tag { background: var(--grad); }
    input:checked + .tag::after {
      transform: translate(16px, -50%);
      background: #fff;
    }
    input:focus-visible + .tag {
      outline: 2px solid var(--grad-a);
      outline-offset: 2px;
    }

    /* Hide chips: a 2-column grid of toggles */
    .chips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .chip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--hair);
      font-size: 12px;
      font-weight: 500;
      color: var(--tx2);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .chip:hover { background: var(--chip-hover); }
    .chip input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
    }
    .chip .tick {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid var(--tx2);
      opacity: 0.6;
      display: grid;
      place-items: center;
      transition: 0.15s;
    }
    .chip .tick svg { opacity: 0; }
    .chip:has(input:checked) {
      color: var(--tx);
      border-color: color-mix(in srgb, var(--grad-a) 55%, transparent);
    }
    .chip:has(input:checked) .tick {
      border-color: transparent;
      background: var(--grad);
      opacity: 1;
    }
    .chip:has(input:checked) .tick svg { opacity: 1; }
    .chip:has(input:focus-visible) {
      outline: 2px solid var(--grad-a);
      outline-offset: 2px;
    }

    /* Theme picker */
    .swatches {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.on {
      border-color: var(--tx);
      box-shadow: 0 0 0 2px var(--bg) inset;
    }
    .swatch:focus-visible { outline: 2px solid var(--grad-a); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="brand">
    <div class="wordmark">ClearFeed</div>
    <div id="cf-timer-line">Ready</div>
  </header>

  <div class="card stats">
    <div id="cf-stats-totals"></div>
    <div class="bars" id="cf-stats-bars"></div>
  </div>

  <div class="section-label">Mode</div>
  <div class="card modes">
    <div class="setting-item">
      <span class="setting-label" id="zenModeLabel">Zen mode
        <span class="setting-hint">Search-only homepage, hides it all</span>
      </span>
      <label class="switch">
        <input type="checkbox" id="zenMode" aria-labelledby="zenModeLabel">
        <span class="tag"></span>
      </label>
    </div>
  </div>

  <div class="section-label">Hide</div>
  <div class="chips">
    <label class="chip">
      <input type="checkbox" id="hideShorts" checked>
      <span class="tick"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Shorts</span>
    </label>
    <label class="chip">
      <input type="checkbox" id="hideSidebar" checked>
      <span class="tick"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Recommended</span>
    </label>
    <label class="chip">
      <input type="checkbox" id="hideComments">
      <span class="tick"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Comments</span>
    </label>
    <label class="chip">
      <input type="checkbox" id="hideHomeFeed">
      <span class="tick"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Home feed</span>
    </label>
    <label class="chip">
      <input type="checkbox" id="hideEndCards">
      <span class="tick"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>End cards</span>
    </label>
    <label class="chip">
      <input type="checkbox" id="hideNotifBell">
      <span class="tick"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2 4.1 7.3 8 3" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Notifications</span>
    </label>
  </div>

  <div class="section-label">Theme</div>
  <div class="swatches" id="cf-themes" role="radiogroup" aria-label="Theme color"></div>

  <script src="popup.js"></script>
</body>
</html>
